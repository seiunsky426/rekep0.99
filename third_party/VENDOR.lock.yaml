    commit: SITE_REQUIRED
    required_imports: [cutie]
    assets: {cutie-base-mega.pth: SITE_REQUIRED}
  curobo:
    relative_path: curobo
    repository: https://github.com/NVlabs/curobo.git
    commit: SITE_REQUIRED
    required_imports: [curobo]
    assets: {}
  nvblox:
